name: reference-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install "markitdown==0.1.6"
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s system/production-reference/meeting -p test_receiver.py -v
      - run: node --test system/production-reference/curation/test-knowledge-temporal.mjs tests/roles.test.mjs
      - run: python tools/check_public.py
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/ci_stack.py
