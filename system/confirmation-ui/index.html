<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="确认中心">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<title>确认中心</title>
<style>
:root{
  --bg:#F4F1EA;--paper:#FFFDF8;--ink:#1B1A17;--ink2:#4A4740;--mute:#8A857B;--line:#E6E0D4;--line2:#EFEAE0;
  --seal:#B8402B;--seal-ink:#FFF7F2;--seal-soft:#F6E4DD;--ok:#2F6B4F;--ok-soft:#E3EFE7;--wait:#9A6A12;--wait-soft:#F6EBD3;
  --shadow:0 1px 0 rgba(27,26,23,.04),0 8px 24px -12px rgba(27,26,23,.18);
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141311;--paper:#1D1B18;--ink:#EEE8DC;--ink2:#C9C2B4;--mute:#8E887C;--line:#2E2B26;--line2:#26231F;
  --seal:#D9654D;--seal-ink:#1A0F0B;--seal-soft:#3A221B;--ok:#7CC29B;--ok-soft:#1F2F26;--wait:#E0B357;--wait-soft:#33291A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font:16px/1.6 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 96px)}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
/* 顶部 */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top .wrap{padding-top:14px;padding-bottom:12px}
.date{font-size:12px;letter-spacing:.14em;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.date button{all:unset;cursor:pointer;color:var(--mute);font-size:12px;letter-spacing:.06em;padding:4px 0 4px 10px}
.date button:active{color:var(--ink)}
h1{font:600 30px/1.2 var(--serif);margin:10px 0 2px;letter-spacing:.02em}
h1 em{font-style:normal;color:var(--seal)}
.sub{color:var(--ink2);font-size:14px;margin:0}
.bar{height:3px;border-radius:3px;background:var(--line);margin:14px 0 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--seal);border-radius:3px;transition:width .6s var(--ease)}
.tabs{display:flex;gap:6px;margin-top:14px;padding:4px;background:var(--line2);border-radius:12px}
.tabs button{all:unset;flex:1;text-align:center;font-size:14px;padding:8px 0;border-radius:9px;color:var(--ink2);cursor:pointer;transition:background .2s,color .2s}
.tabs button b{font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* 卡片 */
.list{padding-top:16px}
.card{scroll-margin-top:200px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px 18px 18px;margin:0 0 14px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;animation:rise .42s var(--ease) both}
.card.leave{animation:leave .38s var(--ease) forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(-8px) scale(.98);max-height:0;margin:0;padding-top:0;padding-bottom:0}}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);letter-spacing:.04em}
.kind{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:6px;background:var(--line2);color:var(--ink2);font-weight:500;letter-spacing:.08em}
.eyebrow .dot{width:3px;height:3px;border-radius:50%;background:var(--mute)}
.q{font:600 19px/1.55 var(--serif);margin:10px 0 0;letter-spacing:.01em;word-break:break-word}
.q .about{color:var(--seal)}
.pagechip{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:13px;color:var(--ink2);text-decoration:none;border-bottom:1px dashed var(--line)}
.pagechip:active{color:var(--seal)}
.draft{margin-top:16px;border-radius:14px;background:var(--bg);padding:14px 14px 12px;border:1px solid var(--line2)}
.draft .h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);letter-spacing:.06em}
.trust{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);letter-spacing:.04em}
.draft p{margin:8px 0 0;font-size:15.5px;line-height:1.7;color:var(--ink)}
details.src{margin-top:8px}
details.src summary{list-style:none;cursor:pointer;font-size:13px;color:var(--mute)}
details.src summary::-webkit-details-marker{display:none}
details.src summary::after{content:" ›";display:inline-block;transition:transform .2s}
details.src[open] summary::after{transform:rotate(90deg)}
details.src ol{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
details.src li{margin:4px 0}
details.src a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.acts{margin-top:16px;display:grid;gap:8px}
.btn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 14px;border-radius:13px;
  font-size:15px;font-weight:500;cursor:pointer;background:var(--line2);color:var(--ink);transition:transform .12s var(--ease),background .2s,opacity .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--seal);color:var(--seal-ink);font-weight:600;min-height:50px;font-size:16px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.row.r4{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.linkbtn{background:none;border:0;color:var(--mute);font-size:12.5px;text-decoration:underline;padding:6px 0;cursor:pointer;justify-self:center}
.later-box{margin-top:18px}.later-box>summary{cursor:pointer;color:var(--mute);font-size:14px;padding:12px 4px}
.row.r4 .btn{font-size:13.5px;padding:0 4px;min-height:42px}
.compose{display:none;margin-top:12px;animation:rise .3s var(--ease) both}
.compose.on{display:block}
.compose label{font-size:13px;color:var(--mute);display:block;margin-bottom:6px}
textarea,input[type=text]{width:100%;font:16px/1.6 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;resize:none;transition:border-color .2s}
textarea:focus,input[type=text]:focus{border-color:var(--seal)}
textarea{min-height:92px}
.compose .row{margin-top:8px}
/* 发言人 */
.player{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line2)}
.audio-engine{display:none}
.play{all:unset;flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;cursor:pointer;transition:transform .12s}
.play:active{transform:scale(.92)}
.play svg{width:14px;height:14px}
.track{flex:1;height:28px;display:flex;align-items:center;gap:2px;cursor:pointer}
.track i{flex:1;background:var(--line);border-radius:2px;transition:background .15s}
.track i.on{background:var(--seal)}
.time{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.quote{margin:12px 0 0;padding:0 0 0 12px;border-left:2px solid var(--line);font-size:14px;color:var(--ink2)}
.quote small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.quote a{color:var(--mute)}
.guess{margin-top:14px;font-size:14px;color:var(--ink2)}
.guess b{font:600 17px var(--serif);color:var(--ink);margin:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{all:unset;cursor:pointer;padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-size:15px;transition:transform .12s,background .2s}
.chip small{color:var(--mute);font-size:12px;margin-left:4px}
.chip:active{transform:scale(.96)}
.chip.best{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.chip.best small{color:inherit;opacity:.75}
.more{margin-top:12px;font-size:13px;color:var(--mute);cursor:pointer;display:inline-block}
/* 已处理 */
.done-row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);animation:rise .3s var(--ease) both}
.done-row:last-child{border-bottom:0}
.done-row .main{flex:1;min-width:0}
.done-row .t{font-size:14px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.done-row .a{font:600 15px/1.5 var(--serif);margin-top:2px;word-break:break-word}
.state{display:inline-flex;align-items:center;gap:5px;font-size:12px;margin-top:6px;padding:2px 8px;border-radius:999px}
.state.ok{background:var(--ok-soft);color:var(--ok)}.state.wait{background:var(--wait-soft);color:var(--wait)}.state.snz{background:var(--line2);color:var(--mute)}
.undo{all:unset;cursor:pointer;font-size:13px;color:var(--seal);padding:4px 0 4px 8px;white-space:nowrap}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:4px 18px;box-shadow:var(--shadow)}
.group{font-size:12px;letter-spacing:.12em;color:var(--mute);margin:18px 4px 8px}
/* 空状态 */
.empty{text-align:center;padding:56px 12px 24px;color:var(--ink2)}
.seal{width:84px;height:84px;margin:0 auto 18px;border:2.5px solid var(--seal);border-radius:14px;display:grid;place-items:center;transform:rotate(-8deg);
  font:700 22px/1.05 var(--serif);color:var(--seal);letter-spacing:.1em;opacity:.9}
.empty h2{font:600 20px var(--serif);margin:0 0 6px;color:var(--ink)}
.empty p{margin:0;font-size:14px}
/* 盖章动画 */
.stamp{position:absolute;right:18px;top:16px;border:2px solid var(--seal);color:var(--seal);border-radius:8px;padding:2px 8px;font:700 15px var(--serif);
  letter-spacing:.2em;transform:rotate(-10deg) scale(1.8);opacity:0;animation:stamp .34s var(--ease) forwards;background:var(--paper)}
@keyframes stamp{to{transform:rotate(-10deg) scale(1);opacity:1}}
/* 提示条 */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,24px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 14px 12px 16px;display:flex;gap:14px;align-items:center;font-size:14px;
  width:min(92vw,520px);box-shadow:0 12px 40px -12px rgba(0,0,0,.5);transition:transform .32s var(--ease),opacity .32s var(--ease);z-index:20}
.toast{visibility:hidden}.toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto;visibility:visible}
.toast span{flex:1}
.toast button{all:unset;cursor:pointer;color:var(--seal-soft);font-weight:600;padding:4px 2px}
@media (prefers-color-scheme:dark){.toast button{color:var(--seal)}}
.err{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--seal-soft);color:var(--seal);font-size:14px}
.foot{margin:28px 4px 0;font-size:12px;line-height:1.7;color:var(--mute)}
.skel{height:180px;border-radius:20px;margin-bottom:14px;background:linear-gradient(100deg,var(--line2) 40%,var(--paper) 50%,var(--line2) 60%) 0 0/300% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-150% 0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (min-width:700px){h1{font-size:34px}.card{padding:24px 24px 22px}}
.tabs{overflow-x:auto}.tabs button{white-space:nowrap}#vocab-search{box-sizing:border-box;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px}
</style>
</head>
<body>
<header class="top" id="top"><div class="wrap">
  <div class="date"><span id="date"></span><button id="refresh" aria-label="刷新">刷新</button></div>
  <h1 id="title">确认中心</h1>
  <p class="sub" id="sub">正在读取…</p>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <nav class="tabs" role="tablist">
    <button data-tab="q" class="on" role="tab">知识确认<b id="nq"></b></button>
    <button data-tab="s" role="tab">发言人<b id="ns"></b></button>
    <button data-tab="d" role="tab">已处理<b id="nd"></b></button>
    <button data-tab="v" role="tab">已确认词典<b id="nv"></b></button>
  </nav>
</div></header>
<main class="wrap"><div id="msg"></div><div class="list" id="list"><div class="skel"></div><div class="skel"></div></div>
<p class="foot" id="foot"></p></main>
<div class="toast" id="toast" role="status"><span id="toast-t"></span><button id="toast-b" hidden>撤销</button></div>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var cfg = window.KBC_CONFIG || {}, API = cfg.api || '/kbc';
  var localOnly = cfg.profile === 'isolated-local';
  var tab = 'q', data = null, busy = {}, toastTimer = null, audio = null, playing = null, vocabulary = null;
  var $ = function (id) { return document.getElementById(id); };
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function wl(s) { return esc(String(s || '').replace(/\[\[([^\]|]+?)(?:\|([^\]]+))?\]\]/g, function (_, p, a) { return '「' + (a || p.split('/').pop().replace(/\.md$/, '')) + '」'; })); }
  function olink(p) { return 'obsidian://open?vault=' + encodeURIComponent(cfg.vault || 'MyWiki') + '&file=' + encodeURIComponent(String(p || '').replace(/\.md$/, '')); }
  function safeLink(value) {
    try { var u = new URL(String(value), location.href); return ['http:', 'https:', 'obsidian:'].indexOf(u.protocol) >= 0 ? u.href : '#'; }
    catch(e) { return '#'; }
  }
  function isoWeek(d) { var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); var n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); var y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); }
  (function () { var d = new Date(); $('date').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + WEEK[d.getDay()] + ' · 第' + isoWeek(d) + '周'; })();
  function err(t) { $('msg').innerHTML = t ? '<div class="err">' + esc(t) + '</div>' : ''; }
  function toast(t, undoId) {
    $('toast-t').textContent = t; var b = $('toast-b'); b.hidden = !undoId; b.onclick = undoId ? function () { act(undoId, 'undo'); hideToast(); } : null;
    $('toast').classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, undoId ? 6000 : 2600);
  }
  function hideToast() { $('toast').classList.remove('on'); }
  function call(a, body) {
    var opt = { credentials: 'same-origin' };
    if (body) {
      opt.method = 'POST'; opt.headers = { 'Content-Type': 'application/json', 'X-Wiki-CSRF': cfg.csrf || '' };
      opt.body = JSON.stringify(Object.assign({ a: a }, body));
    }
    var url = API + (body ? '' : '?a=' + encodeURIComponent(a));
    return fetch(url, opt).then(function(r) { return r.json().catch(function() { return {}; }).then(function(j) {
      if(!r.ok) throw new Error(j.error || ('出错了（' + r.status + '）')); return j;
    }); });
  }
  function load(quiet) {
    if (quiet && (tab === 'v' || (audio && !audio.paused))) return Promise.resolve();
    return call('list').then(function (j) { data = j; err(''); render(); }).catch(function (e) { if (!quiet || !data) err('读取失败：' + e.message + '。稍后会自动重试。'); });
  }
  function buckets() {
    var its = (data.items || []).filter(function (i) { return i.status !== 'retired' || i.auto_closed; });
    return {
      q: its.filter(function (i) { return i.type === 'kb_question' && i.status === 'open'; }).sort(function (a, b) { return (b.card.score || 0) - (a.card.score || 0) || (b.card.refs || 0) - (a.card.refs || 0) || (a.id < b.id ? -1 : 1); }),
      s: its.filter(function (i) { return i.type !== 'kb_question' && i.status === 'open'; }).sort(function (a, b) { return a.id < b.id ? -1 : 1; }),
      d: its.filter(function (i) { return i.status !== 'open'; }).sort(function (a, b) { return (b.resolved_at || '') < (a.resolved_at || '') ? -1 : 1; })
    };
  }
  /* ---------- 知识确认卡 ---------- */
  function qCard(it) {
    var c = it.card || {}, d = c.draft, id = esc(it.id);
    var h = '<article class="card" id="c-' + id + '"><div class="eyebrow"><span class="kind">' + esc(c.label || '知识') + '</span><span>' + esc(c.title || '') + '</span>'
      + (c.refs ? '<span class="dot"></span><span>被 ' + esc(c.refs) + ' 页引用</span>' : '') + '</div>'
      + '<div class="q">' + wl(d && d.ask ? d.ask : it.card.question) + '</div>'
      + (d && d.ask ? '<details class="src"><summary>整理程序的原始问法</summary><p style="margin:6px 0 0">' + wl(it.card.question) + '</p></details>' : '')
      + (c.page ? '<a class="pagechip" href="' + esc(olink(c.page)) + '">在 Obsidian 打开原页 ↗</a>' : '');
    if (d && d.text) {
      h += '<div class="draft"><div class="h"><span>整理助手 查过资料后的答案</span><span class="trust">' + esc(d.trust || '待你确认') + '</span></div><p>' + wl(d.text) + '</p>';
      if (d.sources && d.sources.length) {
        h += '<details class="src"><summary>依据 ' + d.sources.length + ' 条</summary><ol>' + d.sources.map(function (s) { return '<li><a href="' + esc(safeLink(s.link || olink(s.page))) + '">' + wl(s.title) + '</a></li>'; }).join('') + '</ol></details>';
      }
      h += '</div>';
    }
    if (c.choices && c.choices.length) {
      h += '<div class="acts">' + c.choices.map(function (v, n) { return '<button class="btn' + (n === 0 ? ' main' : '') + '" data-a="choose" data-v="' + esc(v) + '" data-id="' + id + '">' + esc(v) + '</button>'; }).join('')
        + '<div class="row r4"><button class="btn" data-a="open-fix" data-id="' + id + '">写几句</button><button class="btn ghost" data-a="later" data-id="' + id + '">先跳过</button></div></div>';
    } else {
      h += '<div class="acts">' + (d && d.text ? '<button class="btn main" data-a="confirm" data-id="' + id + '">对</button>' : '<button class="btn main" data-a="open-fix" data-id="' + id + '">我来写答案</button>')
        + '<div class="row r4">' + (d && d.text ? '<button class="btn" data-a="open-fix" data-id="' + id + '">不对，我改</button>' : '')
        + '<button class="btn" data-a="forgot" data-id="' + id + '">我也拿不准</button>'
        + '<button class="btn ghost" data-a="later" data-id="' + id + '">先跳过</button></div>'
        + '<button class="linkbtn" data-a="invalid" data-id="' + id + '">这题问得没意义，以后别问</button></div>';
    }
    h += ''
      + '<div class="compose" id="f-' + id + '"><label id="l-' + id + '"></label><textarea id="t-' + id + '" rows="3"></textarea>'
      + '<div class="row"><button class="btn ghost" data-a="cancel" data-id="' + id + '">取消</button><button class="btn main" data-a="send" data-id="' + id + '">记下</button></div></div></article>';
    return h;
  }
  /* ---------- 发言人卡 ---------- */
  var BARS = 36;
  function sCard(it) {
    var c = it.card || {}, id = esc(it.id), pr = (data.predict || {})[it.id] || {}, sug = pr.suggest;
    var h = '<article class="card" id="c-' + id + '"><div class="eyebrow"><span class="kind">发言人</span><span>' + esc(c.summary || '') + '</span></div>'
      + '<div class="q">' + esc(c.question) + '</div>';
    (it.audioUrls || []).forEach(function (u, n) {

  $('refresh').onclick = function () { $('refresh').textContent = '刷新中'; if(tab === 'v') { vocabulary = null; renderVocabulary(); $('refresh').textContent = '刷新'; return; } load().then(function () { $('refresh').textContent = '刷新'; }); };
  window.addEventListener('scroll', function () { $('top').classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(true); });
  setInterval(function () { if (!document.hidden && !document.querySelector('.compose.on') && !playing) load(true); }, 30000);
  if(cfg.profile === 'isolated-local') {
    var banner = document.createElement('p'); banner.className = 'wrap'; banner.textContent = '本地参考环境 · 发言人是虚构示例 · 回答即投稿，最终入库由整理回执决定 · 没有自动调度'; document.querySelector('main').prepend(banner);
  }
  load();
})();
</script>
