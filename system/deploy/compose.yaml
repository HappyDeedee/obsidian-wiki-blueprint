name: wiki-blueprint
services:
  couchdb:
    image: couchdb@sha256:5fc596110eac7f412173a7d9de14f70aa5d3e816790fb6e70642755d4a4cf464
    # Skip the root entrypoint's chown of our read-only configuration mount.
    user: couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_ADMIN_USER:?Run tools/deploy.py init first}
      COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD:?Missing generated secret}
    ports: ["127.0.0.1:${COUCHDB_LOCAL_PORT:-15984}:5984"]
    volumes:
      - couch-data:/opt/couchdb/data
      - ./couchdb.ini:/opt/couchdb/etc/local.d/wiki.ini:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  mcp-reader:
    image: ghcr.io/es617/obsidian-sync-mcp@sha256:d8d71417ed3beea16573bcef581d096fd17903da514b42b2020cf358a98b6ce0
    restart: unless-stopped
    depends_on: [couchdb]
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${LIVESYNC_USER:?Missing application user}
      COUCHDB_PASSWORD: ${LIVESYNC_PASSWORD:?Missing generated secret}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-wiki}
      COUCHDB_PASSPHRASE: ${COUCHDB_PASSPHRASE:?Missing generated E2E passphrase}
      COUCHDB_OBFUSCATE_PROPERTIES: "false"
      COUCHDB_CASE_SENSITIVE: "false"
      VAULT_NAME: ${VAULT_NAME:-MyWiki}
      MCP_AUTH_TOKEN: ${MCP_READER_TOKEN:?Missing generated secret}
      BASE_URL: ${MCP_PUBLIC_URL:?Set your own HTTPS URL}
      READ_ONLY: "true"
      DATA_DIR: /data
      DISPLAY_TIMEZONE: ${TZ:-Asia/Shanghai}
    ports: ["127.0.0.1:${MCP_LOCAL_PORT:-18787}:8787"]
    volumes: [mcp-reader-data:/data]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  couch-data:
  mcp-reader-data:
